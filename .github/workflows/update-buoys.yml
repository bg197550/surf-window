name: Refresh buoy data

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buoy-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch NDBC buoys
        run: node scripts/update-buoys.mjs "$RUNNER_TEMP/buoys.json"
      - name: Publish to data branch (single commit, keeps main history clean)
        run: |
          mkdir "$RUNNER_TEMP/data" && cd "$RUNNER_TEMP/data"
          git init -q -b data
          cp "$RUNNER_TEMP/buoys.json" buoys.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add buoys.json
          git commit -q -m "Buoy data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
